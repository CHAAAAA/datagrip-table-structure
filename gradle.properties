# --- Gradle ---
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
# 首次跑通前建议先关掉配置缓存，排错更直观；稳定后再打开
# org.gradle.configuration-cache=true

# --- Plugin metadata (consumed by build.gradle.kts / plugin.xml patching) ---
pluginGroup=com.example
pluginName=Table Structure Viewer
pluginVersion=0.1.0

# --- Target IntelliJ Platform (DataGrip 2026.2.6, build DB-262.10968.148) ---
platformVersion=2026.2.6
platformBuild=262

# 本机已安装的 DataGrip，用于 `local(...)` 依赖方式（零下载、与运行环境完全一致）。
# macOS 关键点：必须指向 .app 内部的 Contents，而不是 .app 本身（否则找不到 product-info.json）。
datagripPath=/Users/wangyc/Applications/DataGrip.app/Contents

# DataGrip 2026.2 使用 JBR 25；把 DataGrip 自带 JBR 注册为 Gradle toolchain，
# 避免额外安装 JDK 25（Gradle 本体仍可用系统 JDK 21 启动；编译用 25）。
# 不设置会出现：No matching toolchains found {languageVersion=25}
org.gradle.java.installations.paths=/Users/wangyc/Applications/DataGrip.app/Contents/jbr/Contents/Home

# verifyPlugin 默认会去 Marketplace 找“推荐 IDE”（插件未发布时失败）；
# 本项目已在 build.gradle.kts 中显式配置本地 DataGrip，这里再加一道保险。
verifyPluginDefaultRecommendedIdes=false
