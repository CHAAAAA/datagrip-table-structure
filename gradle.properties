# Gradle
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true

# 插件元信息，由 build.gradle.kts 写入最终 plugin.xml
pluginGroup=com.github.chaaaaa.datagripts
pluginName=Table Structure Viewer
pluginVersion=0.1.1

# 目标平台：DataGrip 2026.2.6（DB-262.10968.148）
platformBuild=262

# 本机路径通过 -PdatagripPath 或 ~/.gradle/gradle.properties 配置，详见 README。

# 验证使用本地 DataGrip，不从 Marketplace 查询推荐 IDE。
verifyPluginDefaultRecommendedIdes=false
